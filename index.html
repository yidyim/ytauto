<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Automator Pro - Multi Channel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
  
  <header class="bg-gray-800 border-b border-gray-700 py-4 px-6 flex justify-between items-center">
    <h1 class="text-xl font-bold text-red-500 flex items-center gap-2">
      <i class="fa-brands fa-youtube text-2xl"></i> YT Automator Pro
    </h1>
    <div class="flex gap-2">
      <button onclick="loginYouTube()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2">
        <i class="fa-solid fa-user-plus"></i> Tambah / Hubungkan Channel Lain
      </button>
    </div>
  </header>

  <div class="container mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Bagian Kiri: Pengaturan & Upload -->
    <div class="lg:col-span-7 bg-gray-800 rounded-xl p-6 border border-gray-700 space-y-4">
      <h2 class="text-lg font-semibold border-b border-gray-700 pb-2"><i class="fa-solid fa-cloud-arrow-up text-blue-400"></i> Upload & AI Otomasi</h2>
      
      <div>
        <label class="block text-xs font-semibold mb-1">Gemini API Key:</label>
        <div class="flex gap-2">
          <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." class="flex-1 bg-gray-700 border border-gray-600 rounded p-2 text-xs text-white">
          <button onclick="fetchAvailableModels()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded text-xs font-semibold transition flex items-center gap-1">
            <i class="fa-solid fa-rotate"></i> Update List Model
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Pilih Model Gemini:</label>
        <select id="geminiModelSelect" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs text-white">
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (Default)</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Pilih Channel Target Upload:</label>
        <select id="channelSelect" onchange="loadDashboardVideos()" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm text-white">
          <option value="">-- Belum Ada Channel Terhubung --</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Pilih Berkas Video (Otomatis Auto-Rename):</label>
        <input type="file" id="videoFileInput" accept="video/*" onchange="handleVideoSelection()" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm text-white">
      </div>

      <div>
        <label class="block text-xs font-semibold mb-1">Pilih Berkas Thumbnail Foto (Opsional, Auto-Rename):</label>
        <input type="file" id="thumbFileInput" accept="image/*" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm text-white">
      </div>

      <button id="btnProcess" onclick="processVideoWithAI()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Proses AI & Buat SEO Metadata
      </button>

      <!-- Hasil AI -->
      <div id="aiResultArea" class="hidden space-y-4 border-t border-gray-700 pt-4">
        <div>
          <label class="block text-xs font-semibold text-green-400 mb-1">Nama Berkas Baru (Auto-Rename):</label>
          <input type="text" id="aiFileName" readonly class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs font-mono text-green-300">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Judul Video SEO (FYP):</label>
          <input type="text" id="aiTitle" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-sm">
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Deskripsi & Timestamps (Snipping Time):</label>
          <textarea id="aiDescription" rows="5" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold mb-1">Tags YouTube (Evergreen):</label>
          <input type="text" id="aiTags" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs">
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1">Kategori:</label>
            <select id="aiCategory" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs">
              <option value="22">People & Blogs</option>
              <option value="24">Entertainment</option>
              <option value="20">Gaming</option>
              <option value="27">Education</option>
              <option value="28">Science & Technology</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold mb-1">Untuk Anak-Anak?</label>
            <select id="aiKids" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs">
              <option value="false">Tidak (Default)</option>
              <option value="true">Ya, Untuk Anak-anak</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold mb-1">Visibilitas:</label>
            <select id="uploadVisibility" onchange="toggleScheduleInput()" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs">
              <option value="scheduled">Dijadwalkan (Default)</option>
              <option value="public">Publik</option>
              <option value="private">Privat</option>
              <option value="unlisted">Tidak Publik</option>
            </select>
          </div>
          <div id="scheduleTimeBox">
            <label class="block text-xs font-semibold mb-1">Waktu Jadwal:</label>
            <input type="datetime-local" id="scheduleTime" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-xs">
          </div>
        </div>

        <div id="progressContainer" class="hidden">
          <div class="flex justify-between text-xs mb-1">
            <span id="progressText">Mengunggah ke YouTube...</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="w-full bg-gray-700 h-3 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-green-500 h-full w-0 transition-all"></div>
          </div>
        </div>

        <button id="btnUpload" onclick="startYouTubeUpload()" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-upload"></i> Unggah Sekarang ke YouTube
        </button>
      </div>

    </div>

    <!-- Bagian Kanan: Studio Dashboard ala YT Studio Mobile -->
    <div class="lg:col-span-5 bg-gray-800 rounded-xl p-6 border border-gray-700 flex flex-col h-[750px]">
      <h2 class="text-lg font-semibold border-b border-gray-700 pb-2 mb-3 flex items-center justify-between">
        <span><i class="fa-solid fa-photo-film text-purple-400"></i> YT Studio Mobile</span>
        <button onclick="loadDashboardVideos()" class="text-xs text-gray-400 hover:text-white"><i class="fa-solid fa-rotate"></i> Refresh</button>
      </h2>

      <div class="flex gap-2 mb-4">
        <select id="filterType" onchange="loadDashboardVideos()" class="bg-gray-700 text-xs rounded p-2 border border-gray-600 text-white flex-1">
          <option value="all">Semua Video</option>
          <option value="shorts">Shorts (< 60s)</option>
          <option value="long">Long-form</option>
        </select>
      </div>

      <div id="videoList" class="flex-1 overflow-y-auto space-y-3 pr-2">
        <div class="text-center text-gray-500 text-xs mt-10">Pilih channel di atas untuk memuat video secara real-time.</div>
      </div>
    </div>

  </div>

  <script>
    // MASUKKAN CLIENT ID GOOGLE CLOUD ANDA DI SINI
    const CLIENT_ID = '24742527194-3bg7vg9c1r99s0f0936id2v1dsmqle6o.apps.googleusercontent.com';

    window.onload = async function() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      
      if (accessToken) {
        let accounts = JSON.parse(localStorage.getItem('yt_multi_accounts') || '[]');
        try {
          const res = await fetch('https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true', {
            headers: { 'Authorization': `Bearer ${accessToken}` }
          });
          const data = await res.json();
          if (data.items && data.items.length > 0) {
            const ch = data.items[0];
            // Simpan akun unik
            accounts = accounts.filter(a => a.id !== ch.id);
            accounts.push({ id: ch.id, title: ch.snippet.title, token: accessToken });
            localStorage.setItem('yt_multi_accounts', JSON.stringify(accounts));
          }
        } catch (e) {
          console.error("Gagal simpan akun:", e);
        }
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      renderChannelDropdown();
    };

    function loginYouTube() {
      let redirectUri = window.location.href.split('#')[0];
      const scopes = 'https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.readonly';
      const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${encodeURIComponent(scopes)}&include_granted_scopes=true&prompt=consent`;
      window.location.href = authUrl;
    }

    function renderChannelDropdown() {
      const accounts = JSON.parse(localStorage.getItem('yt_multi_accounts') || '[]');
      const select = document.getElementById('channelSelect');
      select.innerHTML = '';

      if (accounts.length === 0) {
        select.innerHTML = '<option value="">-- Belum Ada Channel Terhubung --</option>';
        return;
      }

      accounts.forEach(acc => {
        const opt = document.createElement('option');
        opt.value = acc.id;
        opt.textContent = acc.title;
        select.appendChild(opt);
      });

      loadDashboardVideos();
    }

    function getActiveToken() {
      const channelId = document.getElementById('channelSelect').value;
      const accounts = JSON.parse(localStorage.getItem('yt_multi_accounts') || '[]');
      const acc = accounts.find(a => a.id === channelId);
      return acc ? acc.token : null;
    }

    async function fetchAvailableModels() {
      const apiKey = document.getElementById('geminiKeyInput').value.trim();
      if (!apiKey) return alert("Masukkan Gemini API Key terlebih dahulu!");

      const select = document.getElementById('geminiModelSelect');
      select.innerHTML = '<option>Memuat daftar model...</option>';

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error ? data.error.message : "Gagal mengambil model.");

        select.innerHTML = '';
        const generateModels = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"));

        generateModels.forEach(m => {
          const modelCleanName = m.name.replace('models/', '');
          const option = document.createElement('option');
          option.value = modelCleanName;
          option.textContent = `${m.displayName || modelCleanName} (${modelCleanName})`;
          select.appendChild(option);
        });
        alert(`Berhasil memperbarui ${generateModels.length} model terbaru!`);
      } catch (err) {
        alert("Gagal mengambil model: " + err.message);
        select.innerHTML = '<option value="gemini-3.8-flash">Gemini 3.8 Flash (Default)</option>';
      }
    }

    function handleVideoSelection() {
      const fileInput = document.getElementById('videoFileInput');
      if(fileInput.files[0]) {
        // Simulasi auto-rename tampilan awal
        document.getElementById('aiFileName').value = fileInput.files[0].name;
      }
    }

    function toggleScheduleInput() {
      const vis = document.getElementById('uploadVisibility').value;
      const box = document.getElementById('scheduleTimeBox');
      if (vis === 'scheduled') box.classList.remove('hidden');
      else box.classList.add('hidden');
    }

    async function processVideoWithAI() {
      const apiKey = document.getElementById('geminiKeyInput').value.trim();
      const selectedModel = document.getElementById('geminiModelSelect').value;
      const fileInput = document.getElementById('videoFileInput');

      if (!apiKey) return alert("Masukkan Gemini API Key terlebih dahulu!");
      if (!fileInput.files[0]) return alert("Pilih berkas video terlebih dahulu!");

      const fileName = fileInput.files[0].name;
      const btn = document.getElementById('btnProcess');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Gemini sedang menganalisis...';

      const prompt = `Analisis topik video berdasarkan nama file: "${fileName}". 
      Buatkan metadata YouTube SEO Evergreen terlengkap dalam format JSON murni tanpa markdown, dengan properti:
      {
        "newFileName": "nama_file_baru_seo.mp4",
        "title": "Judul Video SEO FYP dengan Emotikon Menarik",
        "description": "Deskripsi rapi, menarik, berisi timestamps 00:00, paragraf berkualitas, dan hashtag tag evergreen di akhir.",
        "tags": ["tag1", "tag2", "tag3", "tag4", "tag5"],
        "categoryId": "22"
      }`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error ? result.error.message : "Gagal terhubung ke API Gemini");

        const textResponse = result.candidates[0].content.parts[0].text;
        let cleanJson = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
        const data = JSON.parse(cleanJson);

        document.getElementById('aiFileName').value = data.newFileName || fileName;
        document.getElementById('aiTitle').value = data.title;
        document.getElementById('aiDescription').value = data.description;
        document.getElementById('aiTags').value = data.tags ? data.tags.join(', ') : '';
        document.getElementById('aiCategory').value = data.categoryId || '22';

        document.getElementById('aiResultArea').classList.remove('hidden');
      } catch (err) {
        alert("Error Gemini AI: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Proses AI & Buat SEO Metadata';
      }
    }

    async function startYouTubeUpload() {
      const token = getActiveToken();
      if (!token) return alert("Pilih channel target terlebih dahulu!");

      const fileInput = document.getElementById('videoFileInput');
      const thumbInput = document.getElementById('thumbFileInput');
      if (!fileInput.files[0]) return alert("Pilih file video!");

      const file = fileInput.files[0];
      const title = document.getElementById('aiTitle').value;
      const description = document.getElementById('aiDescription').value;
      const tags = document.getElementById('aiTags').value.split(',').map(t => t.trim());
      const categoryId = document.getElementById('aiCategory').value;
      const privacyStatus = document.getElementById('uploadVisibility').value;
      const madeForKids = document.getElementById('aiKids').value === 'true';
      const publishAt = document.getElementById('scheduleTime').value;

      const metadata = {
        snippet: { title, description, tags, categoryId },
        status: {
          privacyStatus: privacyStatus === 'scheduled' ? 'private' : privacyStatus,
          selfDeclaredMadeForKids: madeForKids
        }
      };

      if (privacyStatus === 'scheduled' && publishAt) {
        metadata.status.publishAt = new Date(publishAt).toISOString();
      }

      document.getElementById('progressContainer').classList.remove('hidden');
      document.getElementById('progressBar').style.width = '30%';
      document.getElementById('progressPercent').textContent = '30% (Menyiapkan Upload...)';

      const boundary = 'foo_bar_baz';
      const delimiter = `\r\n--${boundary}\r\n`;
      const closeDelimiter = `\r\n--${boundary}--`;

      const metadataPart = delimiter + 'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata);
      const filePart = delimiter + `Content-Type: ${file.type || 'video/mp4'}\r\n\r\n`;
      const fileBuffer = await file.arrayBuffer();

      const enc = new TextEncoder();
      const totalBlob = new Blob([enc.encode(metadataPart + filePart), fileBuffer, enc.encode(closeDelimiter)]);

      try {
        document.getElementById('progressBar').style.width = '70%';
        document.getElementById('progressPercent').textContent = '70% (Mengunggah Video ke YouTube...)';

        const response = await fetch('https://www.googleapis.com/upload/youtube/v3/videos?uploadType=multipart&part=snippet,status', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': `multipart/related; boundary=${boundary}`
          },
          body: totalBlob
        });

        const result = await response.json();
        if (response.ok) {
          const videoId = result.id;
          
          // Jika ada custom thumbnail yang dipilih
          if (thumbInput.files[0] && videoId) {
            document.getElementById('progressPercent').textContent = '90% (Mengunggah Custom Thumbnail...)';
            await uploadCustomThumbnail(token, videoId, thumbInput.files[0]);
          }

          document.getElementById('progressBar').style.width = '100%';
          document.getElementById('progressPercent').textContent = '100% (Selesai!)';
          alert("Video & Thumbnail Berhasil Diunggah ke YouTube!");
          loadDashboardVideos();
        } else {
          alert("Upload Gagal: " + (result.error ? result.error.message : 'Unknown error'));
        }
      } catch (err) {
        alert("Terjadi kesalahan jaringan saat upload.");
      }
    }

    async function uploadCustomThumbnail(token, videoId, thumbFile) {
      try {
        await fetch(`https://www.googleapis.com/upload/youtube/v3/thumbnails/set?videoId=${videoId}&uploadType=media`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': thumbFile.type || 'image/jpeg'
          },
          body: thumbFile
        });
      } catch (e) {
        console.error("Gagal upload thumbnail kustom:", e);
      }
    }

    async function loadDashboardVideos() {
      const token = getActiveToken();
      const listContainer = document.getElementById('videoList');
      const filterType = document.getElementById('filterType').value;
      const channelId = document.getElementById('channelSelect').value;

      if (!token || !channelId) {
        listContainer.innerHTML = '<div class="text-center text-gray-500 text-xs mt-10">Pilih channel di atas untuk melihat video.</div>';
        return;
      }

      listContainer.innerHTML = '<div class="text-center text-gray-400 text-xs mt-10"><i class="fa-solid fa-spinner fa-spin"></i> Memuat video real-time...</div>';

      try {
        const searchRes = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${channelId}&maxResults=25&order=date&type=video`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const searchData = await searchRes.json();
        
        if (!searchData.items || searchData.items.length === 0) {
          listContainer.innerHTML = '<div class="text-center text-gray-500 text-xs mt-10">Tidak ada video ditemukan di channel ini.</div>';
          return;
        }

        const videoIds = searchData.items.map(item => item.id.videoId).join(',');
        const videosRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,statistics&id=${videoIds}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const videosData = await videosRes.json();
        let items = videosData.items || [];

        if (filterType === 'shorts') {
          items = items.filter(v => parseDurationInSeconds(v.contentDetails.duration) <= 60);
        } else if (filterType === 'long') {
          items = items.filter(v => parseDurationInSeconds(v.contentDetails.duration) > 60);
        }

        listContainer.innerHTML = '';
        items.forEach(v => {
          const item = document.createElement('div');
          item.className = "bg-gray-700/50 p-3 rounded-lg border border-gray-600 flex gap-3 items-center";
          const thumb = v.snippet.thumbnails.default ? v.snippet.thumbnails.default.url : '';
          const title = v.snippet.title;
          const views = v.statistics ? v.statistics.viewCount : 0;
          const likes = v.statistics ? v.statistics.likeCount : 0;

          item.innerHTML = `
            <img src="${thumb}" class="w-20 h-12 object-cover rounded bg-gray-800">
            <div class="flex-1 min-w-0">
              <h4 class="text-xs font-semibold text-white truncate">${title}</h4>
              <div class="flex gap-3 text-[10px] text-gray-400 mt-1">
                <span><i class="fa-solid fa-eye"></i> ${views} views</span>
                <span><i class="fa-solid fa-thumbs-up"></i> ${likes} likes</span>
              </div>
            </div>
          `;
          listContainer.appendChild(item);
        });
      } catch (err) {
        listContainer.innerHTML = '<div class="text-center text-red-400 text-xs mt-10">Gagal memuat video real-time.</div>';
      }
    }

    function parseDurationInSeconds(isoDuration) {
      const match = isoDuration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
      if (!match) return 0;
      return (parseInt(match[1] || 0) * 3600) + (parseInt(match[2] || 0) * 60) + parseInt(match[3] || 0);
    }
  </script>
</body>
</html>
